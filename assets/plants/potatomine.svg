<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <radialGradient id="soil" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#4a3a22"/>
      <stop offset="1" stop-color="#201608"/>
    </radialGradient>
    <radialGradient id="potato" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#7a5a20"/>
      <stop offset="0.55" stop-color="#54380e"/>
      <stop offset="1" stop-color="#2a1c06"/>
    </radialGradient>
  </defs>

  <!-- 腐土堆 -->
  <path d="M6,70 Q50,44 94,70 Z" fill="url(#soil)" stroke="#140e04" stroke-width="2.5"/>
  <!-- 土堆颗粒 -->
  <g fill="#5a4420" opacity="0.7">
    <circle cx="30" cy="60" r="2"/><circle cx="48" cy="56" r="1.6"/><circle cx="66" cy="60" r="2.2"/><circle cx="20" cy="66" r="1.6"/>
  </g>

  <!-- 土豆顶部（腐烂） -->
  <ellipse cx="50" cy="50" rx="25" ry="15" fill="url(#potato)" stroke="#1c1206" stroke-width="2.5"/>
  <!-- 土豆芽眼 -->
  <g fill="#241a08"><circle cx="60" cy="46" r="2.2"/><circle cx="40" cy="52" r="1.8"/><circle cx="56" cy="55" r="1.8"/></g>
  <!-- 腐斑 -->
  <ellipse cx="46" cy="44" rx="7" ry="4.5" fill="#2a1c08" opacity="0.8"/>
  <!-- 裂缝 -->
  <path d="M52,52 L58,47" stroke="#1c1206" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

  <!-- 惊恐眼（大圆瞪着） -->
  <circle cx="42" cy="48" r="6" fill="#0c0804"/>
  <circle cx="58" cy="48" r="6" fill="#0c0804"/>
  <circle cx="43" cy="49" r="3" fill="#ff6a3a" opacity="0.8"/>
  <circle cx="59" cy="49" r="3" fill="#ff6a3a" opacity="0.8"/>
  <circle cx="42" cy="47" r="1" fill="#ffb08a" opacity="0.8"/>
  <circle cx="58" cy="47" r="1" fill="#ffb08a" opacity="0.8"/>
  <!-- 上挑惊恐眉 -->
  <path d="M36,41 L43,43 M64,41 L57,43" stroke="#1c1206" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 张开的嘴（恐惧） -->
  <ellipse cx="50" cy="56" rx="4.5" ry="3.8" fill="#140c04" stroke="#1c1206" stroke-width="1.6"/>
  <path d="M50,56 L50,60" stroke="#1c1206" stroke-width="1.2"/>
  <!-- 冒汗 -->
  <circle cx="33" cy="42" r="1.6" fill="#7ab6c0" opacity="0.7"/>
  <circle cx="67" cy="42" r="1.6" fill="#7ab6c0" opacity="0.7"/>

  <!-- 引信 -->
  <path d="M50,35 Q55,24 48,18" fill="none" stroke="#5a4420" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="48" cy="18" r="3.2" fill="#ff6a10"/>
  <circle cx="48" cy="18" r="1.6" fill="#ffd04a"/>
  <g fill="#ff8a20" opacity="0.9"><circle cx="56" cy="14" r="2"/><circle cx="41" cy="14" r="1.8"/><circle cx="48" cy="9" r="1.8"/></g>

  <g fill="#8a9c6c" opacity="0.1"><circle cx="80" cy="26" r="2"/><circle cx="14" cy="24" r="1.6"/></g>
</svg>
