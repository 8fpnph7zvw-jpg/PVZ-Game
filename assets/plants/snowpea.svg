<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 霜冻腐肉 -->
    <radialGradient id="flesh" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#5a7a8a"/>
      <stop offset="0.5" stop-color="#3a5462"/>
      <stop offset="1" stop-color="#1a2a34"/>
    </radialGradient>
    <radialGradient id="ice" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#cfeeff"/>
      <stop offset="1" stop-color="#7ab6e0"/>
    </radialGradient>
    <radialGradient id="bone" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e8f0f8"/>
      <stop offset="1" stop-color="#9ab6cc"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3038"/>
      <stop offset="0.5" stop-color="#3a5462"/>
      <stop offset="1" stop-color="#101c22"/>
    </linearGradient>
  </defs>

  <ellipse cx="50" cy="94" rx="28" ry="6" fill="#000" opacity="0.5"/>

  <!-- 根部冰晶触须 -->
  <g stroke="#7ab6e0" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M22,80 Q10,86 6,94"/>
    <path d="M78,80 Q92,84 95,92"/>
  </g>

  <!-- 主茎（覆霜） -->
  <path d="M50,40 L50,84" fill="none" stroke="url(#stem)" stroke-width="7" stroke-linecap="round"/>
  <path d="M49,44 L49,80" fill="none" stroke="#b8e6ff" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- 霜冻躯干 -->
  <ellipse cx="50" cy="46" rx="27" ry="25" fill="url(#flesh)" stroke="#0e1a20" stroke-width="2.5"/>
  <!-- 覆霜斑 -->
  <ellipse cx="40" cy="34" rx="10" ry="7" fill="#cfeeff" opacity="0.25"/>
  <ellipse cx="62" cy="60" rx="9" ry="6" fill="#cfeeff" opacity="0.2"/>

  <!-- 表面白骨化（冰冻露骨） -->
  <path d="M34,52 Q42,60 38,66 Q30,62 26,56 Z" fill="url(#bone)" opacity="0.5"/>

  <!-- 冰晶结晶刺（背上） -->
  <g fill="#cfeeff" stroke="#7ab6e0" stroke-width="1">
    <path d="M56,24 L62,10 L65,24 Z" opacity="0.85"/>
    <path d="M62,32 L72,22 L68,34 Z" opacity="0.6"/>
  </g>

  <!-- 炮口（霜冻骨嘴） -->
  <g>
    <circle cx="50" cy="52" r="11" fill="#0e141a"/>
    <path d="M50,52 L80,47" fill="none" stroke="url(#bone)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="80" cy="47" r="5" fill="#4a7a8a"/>
    <circle cx="50" cy="52" r="6" fill="#16202a"/>
    <circle cx="50" cy="52" r="3" fill="#7ad0ea" opacity="0.6"/>
  </g>

  <!-- 幽蓝眼 -->
  <ellipse cx="40" cy="43" rx="6" ry="5.5" fill="#02060a"/>
  <ellipse cx="60" cy="43" rx="6" ry="5.5" fill="#02060a"/>
  <circle cx="40.5" cy="43.5" r="2.2" fill="#7ad0ea" opacity="0.8"/>
  <circle cx="60.5" cy="43.5" r="2.2" fill="#7ad0ea" opacity="0.8"/>
  <ellipse cx="40" cy="38" rx="5" ry="2.2" fill="#060c10" opacity="0.85"/>
  <ellipse cx="60" cy="38" rx="5" ry="2.2" fill="#060c10" opacity="0.85"/>

  <!-- 头顶冰霜结晶触须 -->
  <g fill="none" stroke="#9ad0f0" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
    <path d="M48,23 Q42,10 47,3"/>
    <path d="M54,23 Q60,8 51,2"/>
  </g>

  <!-- 飘散寒气 -->
  <g stroke="#b8e6ff" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M86,42 Q90,44 92,42"/>
    <path d="M84,50 Q88,52 90,50"/>
  </g>
  <g fill="#8a9c6c" opacity="0.08"><circle cx="10" cy="28" r="2"/><circle cx="90" cy="20" r="1.6"/></g>
</svg>
