<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="62" height="74">
  <defs>
    <radialGradient id="flesh" cx="0.42" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8a9c6c"/>
      <stop offset="0.5" stop-color="#5a6a44"/>
      <stop offset="0.8" stop-color="#3a4428"/>
      <stop offset="1" stop-color="#1c2212"/>
    </radialGradient>
    <!-- 血袍 -->
    <radialGradient id="robe" cx="0.45" cy="0.15" r="1.1">
      <stop offset="0" stop-color="#5c1e18"/>
      <stop offset="0.5" stop-color="#3a100c"/>
      <stop offset="1" stop-color="#180404"/>
    </radialGradient>
    <radialGradient id="blood" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#7a1616"/>
      <stop offset="1" stop-color="#3a0808" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="50" cy="114" rx="28" ry="6" fill="#000" opacity="0.5"/>

  <!-- 双腿(飞奔) -->
  <g stroke="#241a10" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M42,94 L28,112 L20,108"/>
    <path d="M56,94 L68,110 L78,104"/>
  </g>

  <!-- 血袍(前倾飘动) -->
  <path d="M40,40 L30,98 Q46,108 64,102 L62,44 Q52,36 40,40 Z" fill="url(#robe)" stroke="#140202" stroke-width="2.5"/>
  <!-- 袍摆撕裂飘片 -->
  <path d="M32,90 Q28,100 26,108" stroke="#5c1e18" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M64,88 Q70,98 74,104" stroke="#5c1e18" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- 袍上大片血污 -->
  <ellipse cx="48" cy="72" rx="12" ry="9" fill="url(#blood)"/>
  <ellipse cx="60" cy="90" rx="10" ry="7" fill="url(#blood)"/>

  <!-- 双手前伸(抓) -->
  <g stroke="url(#robe)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M40,56 Q8,52 0,34"/>
    <path d="M42,62 Q6,60 2,44"/>
  </g>
  <!-- 白骨爪 -->
  <g stroke="#d8d0bc" stroke-width="2.6" stroke-linecap="round">
    <path d="M-2,32 L-8,27 M4,30 L0,24 M-4,36 L-12,34"/>
    <path d="M0,42 L-7,38 M5,41 L1,35 M-2,47 L-10,47"/>
  </g>
  <circle cx="-6" cy="33" r="2.5" fill="#c8c0a8"/>
  <circle cx="-4" cy="44" r="2.5" fill="#c8c0a8"/>

  <!-- 头(披发遮面，前倾) -->
  <g transform="rotate(14 50 34)">
    <!-- 苍白腐烂脸 -->
    <ellipse cx="50" cy="34" rx="19" ry="20" fill="url(#flesh)" stroke="#202612" stroke-width="2"/>
    <!-- 剥落露骨 -->
    <path d="M56,24 Q64,30 58,42 Q50,47 45,44 Q54,46 60,38 Q62,28 56,24 Z" fill="#c8c0a8" opacity="0.9"/>
    <!-- 披散乱发(长而枯) -->
    <path d="M30,32 Q26,6 46,3 Q50,24 40,36 Q36,32 30,32 Z" fill="#140e0a"/>
    <path d="M68,30 Q72,5 56,3 Q50,22 60,36 Q66,32 68,30 Z" fill="#140e0a"/>
    <path d="M34,38 Q27,64 20,80" stroke="#140e0a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M66,38 Q75,62 80,74" stroke="#140e0a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- 血眼(发间透出) -->
    <circle cx="43" cy="31" r="5" fill="#0a0604"/>
    <circle cx="57" cy="31" r="5" fill="#0a0604"/>
    <circle cx="44" cy="32" r="2.4" fill="#d01616"/>
    <circle cx="58" cy="32" r="2.4" fill="#d01616"/>
    <!-- 撕裂嘴 -->
    <path d="M43,42 Q50,50 57,41" fill="#200604"/>
    <path d="M45,42 L47,49 L50,43 Z" fill="#dcd4c0" stroke="#a89c80" stroke-width="0.9"/>
    <ellipse cx="56" cy="46" rx="4.5" ry="3" fill="url(#blood)"/>
  </g>

  <!-- 额上微光符(破) -->
  <g transform="rotate(-8 50 22)">
    <path d="M41,16 L59,18 L55,32 L43,30 Z" fill="#b89a2a" stroke="#6a5410" stroke-width="1.3" opacity="0.8"/>
    <path d="M45,21 L52,22 M44,25 L50,26" stroke="#6a1010" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 疾风尾迹 -->
  <g stroke="#e8c07a" stroke-width="2.5" opacity="0.4" stroke-linecap="round">
    <line x1="72" y1="30" x2="92" y2="22"/>
    <line x1="74" y1="46" x2="95" y2="42"/>
    <line x1="72" y1="58" x2="92" y2="60"/>
  </g>

  <g fill="#8a9c6c" opacity="0.08"><circle cx="12" cy="28" r="2"/><circle cx="84" cy="20" r="1.5"/></g>
</svg>
