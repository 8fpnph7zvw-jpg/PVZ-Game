<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="62" height="80">
  <defs>
    <radialGradient id="flesh" cx="0.42" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8a9c6c"/>
      <stop offset="0.5" stop-color="#5a6a44"/>
      <stop offset="0.8" stop-color="#3a4428"/>
      <stop offset="1" stop-color="#1c2212"/>
    </radialGradient>
    <radialGradient id="robe" cx="0.45" cy="0.15" r="1.1">
      <stop offset="0" stop-color="#4a4434"/>
      <stop offset="0.5" stop-color="#30281e"/>
      <stop offset="1" stop-color="#160f08"/>
    </radialGradient>
    <radialGradient id="blood" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#6a1414"/>
      <stop offset="1" stop-color="#320606" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="50" cy="122" rx="28" ry="6" fill="#000" opacity="0.5"/>

  <!-- 腿（白骨透袍） -->
  <g stroke="#241a10" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M42,106 L38,124"/><path d="M58,106 L62,122"/>
  </g>

  <!-- 腐败官袍 -->
  <path d="M32,54 L28,112 Q50,122 72,110 L68,52 Q50,42 32,54 Z" fill="url(#robe)" stroke="#0e0804" stroke-width="2.5"/>
  <!-- 袍上血污 -->
  <ellipse cx="42" cy="78" rx="11" ry="8" fill="url(#blood)"/>
  <ellipse cx="60" cy="104" rx="14" ry="9" fill="url(#blood)"/>
  <!-- 袍皱 -->
  <g stroke="#1a1208" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <path d="M38,76 Q48,82 62,78 M38,88 Q50,95 63,90"/>
  </g>

  <!-- 胸前补子（褪色+血） -->
  <g>
    <rect x="40" y="56" width="20" height="22" rx="2" fill="#18120c" stroke="#5a4a22" stroke-width="1.6" opacity="0.9"/>
    <path d="M50,61 L55,66 L50,71 L45,66 Z" fill="#8a6a20" stroke="#5a4416" stroke-width="1" opacity="0.7"/>
    <ellipse cx="52" cy="65" rx="6" ry="5" fill="url(#blood)" opacity="0.8"/>
  </g>

  <!-- 左臂 -->
  <g stroke="url(#robe)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M36,68 Q14,70 4,54"/>
  </g>
  <g>
    <path d="M3,48 L-2,62 L8,66 L10,50 Z" fill="url(#robe)" stroke="#0e0804" stroke-width="1.5"/>
    <path d="M8,53 L15,48 M9,57 L17,55" stroke="#d8d0bc" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="5" cy="56" r="3" fill="#c8c0a8" opacity="0.8"/>
  </g>
  <!-- 右臂 -->
  <g stroke="url(#robe)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M64,68 Q86,70 96,56"/>
  </g>
  <g>
    <path d="M96,50 L102,64 L92,68 L90,52 Z" fill="url(#robe)" stroke="#0e0804" stroke-width="1.5"/>
    <path d="M91,54 L83,50 M90,58 L81,56" stroke="#d8d0bc" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="95" cy="57" r="3" fill="#c8c0a8" opacity="0.8"/>
  </g>

  <!-- 头：腐烂 -->
  <g transform="rotate(4 50 32)">
    <ellipse cx="50" cy="33" rx="21" ry="22" fill="url(#flesh)" stroke="#202612" stroke-width="2"/>
    <path d="M62,24 Q67,33 60,42 Q55,47 50,46 Q58,50 64,42 Q70,32 62,24 Z" fill="#c8c0a8" stroke="#a89c80" stroke-width="1.2" opacity="0.95"/>
    <ellipse cx="42" cy="32" rx="8.5" ry="7.5" fill="#0a0a06"/>
    <ellipse cx="58" cy="32" rx="8.5" ry="7.5" fill="#0a0a06"/>
    <circle cx="43" cy="32" r="2.6" fill="#a01616"/>
    <circle cx="59" cy="32" r="2.6" fill="#a01616"/>
    <ellipse cx="42" cy="26" rx="5" ry="2.5" fill="#1c1208" opacity="0.7"/>
    <ellipse cx="58" cy="26" rx="5" ry="2.5" fill="#1c1208" opacity="0.7"/>
    <path d="M49,38 L48,43 L53,42" fill="none" stroke="#a89c80" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M40,48 L60,44 Q58,56 54,58 Q50,60 46,58 Q42,56 40,48 Z" fill="#180c06" stroke="#0a0603" stroke-width="1.5"/>
    <path d="M44,48 L47,60 L51,48 Z" fill="#dcd4c0" stroke="#a89c80" stroke-width="1"/>
    <path d="M54,47 L57,58 L60,47 Z" fill="#dcd4c0" stroke="#a89c80" stroke-width="1"/>
    <ellipse cx="60" cy="51" rx="6" ry="4" fill="url(#blood)"/>
  </g>

  <!-- 顶戴花翎官帽 -->
  <g>
    <!-- 帽身 -->
    <path d="M30,20 Q50,2 70,20 Q50,11 30,20 Z" fill="#241c2e" stroke="#0e0a14" stroke-width="2"/>
    <path d="M31,20 Q50,12 69,20 L69,24 Q50,15 31,24 Z" fill="#382c42"/>
    <!-- 帽檐帽沿 -->
    <path d="M29,22 Q50,14 71,22 L71,25 Q50,17 29,25 Z" fill="#1c1420"/>
    <!-- 前方红缨顶珠 -->
    <ellipse cx="50" cy="12" rx="4.5" ry="5" fill="#8a1a1a" stroke="#3a0808" stroke-width="1.5"/>
    <circle cx="50" cy="12" r="1.4" fill="#c03028" opacity="0.8"/>
    <!-- 单垂翎（破损） -->
    <path d="M78,14 Q92,2 98,10 Q94,12 78,14 Z" fill="#6a7a84" stroke="#3a444c" stroke-width="1.4" opacity="0.8"/>
    <circle cx="96" cy="11" r="2" fill="#3a444c"/>
  </g>

  <!-- 额上褪色镇尸符 -->
  <g transform="rotate(-7 50 20)">
    <rect x="40" y="14" width="20" height="22" rx="2" fill="#b89a2a" stroke="#6a5410" stroke-width="1.4" opacity="0.9"/>
    <path d="M44,19 L52,20 M43,24 L50,25 M45,28 L51,30" stroke="#6a1010" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g fill="#8a9c6c" opacity="0.08"><circle cx="10" cy="30" r="2"/><circle cx="78" cy="20" r="1.5"/></g>
</svg>
