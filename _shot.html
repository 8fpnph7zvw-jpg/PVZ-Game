<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>植物大战僵尸·暗黑风 素材画廊</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(circle at 50% 20%,#2a2522,#0e0c0a 75%);font-family:"Microsoft YaHei",sans-serif;padding:24px;min-height:100vh;color:#c8c0a8}
  h1{text-align:center;color:#9a8a5a;font-size:25px;letter-spacing:3px;margin-bottom:4px;text-shadow:0 2px 0 #000}
  .sub{text-align:center;color:#6a5a3a;margin-bottom:20px;font-size:13px;letter-spacing:1px}
  h2{color:#8a5a2a;margin:16px 2px 10px;font-size:17px;border-left:6px solid #6a2e24;padding-left:10px}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:8px}
  .item{width:120px;background:rgba(20,18,14,.6);border:2px solid #3a2e1e;border-radius:12px;padding:10px 8px 8px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.6)}
  .item img{height:84px;width:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.6))}
  .item.z img{height:80px}.item.boss img{height:142px}
  .item .nm{font-weight:800;color:#b0a888;margin-top:6px;font-size:13px}
  .item .en{color:#6a5a48;font-size:11px}
  .tags{text-align:center;margin-top:18px;color:#6a5a3a;font-size:13px}
</style>
</head>
<body>
<h1>☠️ 植物大战僵尸 · 暗黑写实 素材画廊</h1>
<div class="sub">黑暗之魂风格 · 血腥腐烂 · 苍凉腐化</div>

<h2>植物 · 暗黑腐化</h2>
<div class="row">
  <div class="item"><img src="assets/plants/sunflower.svg"><div class="nm">腐化向日葵</div><div class="en">50</div></div>
  <div class="item"><img src="assets/plants/peashooter.svg"><div class="nm">骨化豌豆</div><div class="en">100</div></div>
  <div class="item"><img src="assets/plants/snowpea.svg"><div class="nm">霜冻寒冰</div><div class="en">175</div></div>
  <div class="item"><img src="assets/plants/repeater.svg"><div class="nm">双骨炮</div><div class="en">200</div></div>
  <div class="item"><img src="assets/plants/wallnut.svg"><div class="nm">腐岩坚壁</div><div class="en">50</div></div>
  <div class="item"><img src="assets/plants/cherry.svg"><div class="nm">爆裂血果</div><div class="en">150</div></div>
  <div class="item"><img src="assets/plants/potatomine.svg"><div class="nm">腐土雷</div><div class="en">25</div></div>
  <div class="item"><img src="assets/plants/torchwood.svg"><div class="nm">浴火石桩</div><div class="en">175</div></div>
</div>

<h2>僵尸 · 血腥腐烂</h2>
<div class="row">
  <div class="item z"><img src="assets/zombies/normal.svg"><div class="nm">腐尸</div><div class="en">青面白骨</div></div>
  <div class="item z"><img src="assets/zombies/cone.svg"><div class="nm">败冠僵尸</div><div class="en">腐甲官服</div></div>
  <div class="item z"><img src="assets/zombies/bucket.svg"><div class="nm">锈盔僵尸</div><div class="en">铁牢之面</div></div>
  <div class="item z"><img src="assets/zombies/runner.svg"><div class="nm">血红厉鬼</div><div class="en">披发奔袭</div></div>
  <div class="item z"><img src="assets/zombies/flag.svg"><div class="nm">招魂者</div><div class="en">破幡引魂</div></div>
  <div class="item boss"><img src="assets/zombies/boss.svg"><div class="nm">僵尸王 BOSS</div><div class="en">血盆巨颅</div></div>
</div>

<div class="tags">手绘 SVG · 多重光影渐变 · 材质细节 · 暗黑血源风</div>

</html>
